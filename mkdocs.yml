site_name: KubeBrowse
site_description: Documentation for KubeBrowse
site_author: KubeBrowse Team
site_url: https://browsersec.github.io/KubeBrowse/
repo_name: browsersec/KubeBrowse
repo_url: https://github.com/browsersec/KubeBrowse
docs_dir: docs

theme:
  name: material
  logo: material/shield-lock
  favicon: material/shield-lock
  font:
    text: Inter
    code: Fira Code
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.path
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Welcome: index.md
  - Architecture: Architecture.md
  - Contributing: CONTRIBUTING.md
  - Tilt Development: TiltDevelopment.md
  - Future Plan: Future Plan.md
  - Acknowledgements: Acknowledgements.md
